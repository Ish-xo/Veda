<svg width="280" height="280" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Veda AI Avatar">
  <defs>
    <!-- Background Cloud Gradient -->
    <linearGradient id="vedaGrad" x1="20" y1="20" x2="260" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="35%" stop-color="#67e8f9" />
      <stop offset="70%" stop-color="#c4b5fd" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <radialGradient id="innerGlow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Eye Gradient -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Cheek Blush Gradient -->
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0" />
    </radialGradient>

    <!-- Ring Orbit Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.7" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .veda-body {
      transform-origin: 140px 140px;
      animation: vedaFloat 3.5s ease-in-out infinite alternate;
    }
    .veda-eye-left, .veda-eye-right {
      transform-origin: 110px 135px;
      animation: vedaBlink 4s infinite ease-in-out;
    }
    .veda-eye-right {
      transform-origin: 170px 135px;
    }
    .orbit-ring {
      transform-origin: 140px 140px;
      animation: vedaOrbit 7s linear infinite;
    }
    .sparkle {
      animation: vedaSparkle 2.2s infinite ease-in-out alternate;
    }
    .sparkle-2 {
      animation: vedaSparkle 2.8s infinite ease-in-out alternate-reverse;
    }

    @keyframes vedaFloat {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-8px) scale(1.02); }
    }
    @keyframes vedaBlink {
      0%, 46%, 50%, 96%, 100% { transform: scaleY(1); }
      48%, 98% { transform: scaleY(0.08); }
    }
    @keyframes vedaOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes vedaSparkle {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }
  </style>

  <!-- Surrounding Musical Sparkles -->
  <g class="sparkles" fill="#67e8f9">
    <path class="sparkle" d="M 45 75 Q 48 85 58 88 Q 48 91 45 101 Q 42 91 32 88 Q 42 85 45 75 Z" opacity="0.8"/>
    <path class="sparkle-2" d="M 235 90 Q 237 97 244 99 Q 237 101 235 108 Q 233 101 226 99 Q 233 97 235 90 Z" fill="#c084fc" opacity="0.85"/>
    <circle cx="65" cy="180" r="3" fill="#f472b6" class="sparkle-2"/>
    <circle cx="225" cy="195" r="3.5" fill="#38bdf8" class="sparkle"/>
  </g>

  <!-- Orbital Musical Energy Ring -->
  <ellipse cx="140" cy="140" rx="112" ry="42" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.6" transform="rotate(-15 140 140)" stroke-dasharray="8 6" class="orbit-ring" />

  <!-- Main Floating Veda Entity -->
  <g class="veda-body">
    <!-- Cloud / Bubble Body Path -->
    <path d="M 140 50
             C 180 50, 205 70, 215 95
             C 240 100, 255 125, 250 150
             C 255 180, 230 215, 195 220
             C 175 235, 135 235, 110 225
             C 80 230, 50 210, 42 180
             C 25 150, 38 115, 65 100
             C 75 70, 105 50, 140 50 Z"
          fill="url(#vedaGrad)"
          filter="url(#glowFilter)" />

    <!-- Specular Highlight / Glass Sheen Overlay -->
    <path d="M 140 50
             C 180 50, 205 70, 215 95
             C 240 100, 255 125, 250 150
             C 255 180, 230 215, 195 220
             C 175 235, 135 235, 110 225
             C 80 230, 50 210, 42 180
             C 25 150, 38 115, 65 100
             C 75 70, 105 50, 140 50 Z"
          fill="url(#innerGlow)" />

    <!-- Top Gloss Reflection -->
    <ellipse cx="130" cy="85" rx="55" ry="22" fill="#ffffff" opacity="0.45" transform="rotate(-8 130 85)" />

    <!-- Cheeks Blush -->
    <ellipse cx="92" cy="155" rx="14" ry="9" fill="url(#blushGrad)" />
    <ellipse cx="188" cy="155" rx="14" ry="9" fill="url(#blushGrad)" />

    <!-- Left Eye -->
    <g class="veda-eye-left">
      <ellipse cx="110" cy="138" rx="13" ry="17" fill="url(#eyeGrad)" />
      <!-- Catchlights in Eye -->
      <ellipse cx="106" cy="130" rx="5.5" ry="7" fill="#ffffff" />
      <circle cx="115" cy="146" r="3" fill="#ffffff" />
      <path d="M 98 123 Q 109 116 121 123" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Right Eye -->
    <g class="veda-eye-right">
      <ellipse cx="170" cy="138" rx="13" ry="17" fill="url(#eyeGrad)" />
      <!-- Catchlights in Eye -->
      <ellipse cx="166" cy="130" rx="5.5" ry="7" fill="#ffffff" />
      <circle cx="175" cy="146" r="3" fill="#ffffff" />
      <path d="M 159 123 Q 171 116 182 123" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Cute Smiling Mouth -->
    <path d="M 132 156 Q 140 166 148 156" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>
</svg>
